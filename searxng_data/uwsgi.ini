[uwsgi]
# uWSGI core
# ----------
# Who will run the code (in emperor-tyrant mode uid & gid are ignored)
uid = searxng
gid = searxng

# set (python) default encoding UTF-8
env = LANG=C.UTF-8
env = LANGUAGE=C.UTF-8
env = LC_ALL=C.UTF-8

# SearXNG configuration (settings.yml)
env = SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml

# Listening address (placeholder expanded by Docker image; default [::]:8080)
http-socket = $(BIND_ADDRESS)

# Number of workers (usually CPU count)
workers = $(UWSGI_WORKERS)
threads = $(UWSGI_THREADS)

# disable logging for privacy
disable-logging = true
log-5xx = true

# The right granted on the created socket
chmod-socket = 666

# Plugin to use and interpreter config
single-interpreter = true
master = true
lazy-apps = true
enable-threads = true

# Module to import
module = searx.webapp

# Virtualenv and python path
pythonpath = /usr/local/searxng/
chdir = /usr/local/searxng/searx/

# automatically set processes name to something meaningful
auto-procname = true

# Set the max size of a request (request-body excluded)
buffer-size = 8192

# No keep alive (see https://github.com/searxng/searxng/issues/24)
add-header = Connection: close

# Follow SIGTERM convention (see https://github.com/searxng/searxng/issues/3427)
die-on-term

# uwsgi serves the static files
static-map = /static=/usr/local/searxng/searx/static
static-gzip-all = True
offload-threads = %k
